name: Test ARM64 Engine
on: [push, workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: Compile and Run
      run: |
        # 1. 安装依赖
        sudo apt-get update
        sudo apt-get install -y cmake libelf-dev git

        # 2. 编译伪造的安卓库
        gcc -shared -fPIC -o liblog.so fake_android.c
        gcc -shared -fPIC -o libandroid.so fake_android.c
        
        # 3. 修复 libc 软链接
        ln -sf /lib/aarch64-linux-gnu/libc.so.6 libc.so
        ln -sf /lib/aarch64-linux-gnu/libm.so.6 libm.so
        ln -sf /lib/aarch64-linux-gnu/libdl.so.2 libdl.so
        
        # 4. 🔥 终极魔法：编译并运行 termux-elf-cleaner，洗掉安卓专属版本号！
        git clone https://github.com/termux/termux-elf-cleaner.git
        cd termux-elf-cleaner
        cmake .
        make
        sudo make install
        cd ..
        termux-elf-cleaner libmmai.so

        # 5. 编译运行
        g++ -std=c++17 -o server server.cpp -ldl
        export LD_LIBRARY_PATH=$PWD:$LD_LIBRARY_PATH
        ./server
